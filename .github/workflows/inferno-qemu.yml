name: build-inferno-qemu

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'scripts/**' ]

jobs:
  qemu-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install host build prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git python3 python3-venv pkg-config \
            ninja-build meson make

      - name: Setup NDK r28
        run: |
          curl -sSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r28c.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r28c" >> $GITHUB_ENV

      - name: Native deps (zlib/pixman/libfdt)
        run: ./scripts/build-android-deps.sh

      - name: Build libqemu-aarch64-softmmu.so
        run: ./scripts/build-inferno-android.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inferno-qemu-android
          path: |
            android/libqemu-aarch64-softmmu.so
            android/share/
